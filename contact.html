<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e8f8ff;
    color: #003344;
}

h1, h2, h3 {
    color: #006699;
    text-align: center;

header {
    background: #0099cc;
    padding: 15px 0;

}

header img {
    width: 120px;
    height: auto;
    margin-bottom: 10px;
}

nav {
    background: #0077aa;
    padding: 12px;
    text-align: center;
}

nav a {
    color: white;
    margin: 15px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1.1rem;
}

nav a:hover {
    color: #ccefff;
    text-decoration: underline;
}

.container {
    width: 80%;
    margin: auto;
    padding: 20px;
}

form {
    width: 70%;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 12px #bcd;
}

label {
    font-weight: bold;
    color: #004466;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0 20px 0;
    border: 2px solid #0099cc;
    border-radius: 8px;
    font-size: 1rem;
}

input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #006699;
}

input[type="submit"] {
    background: #0099cc;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 12px;
    border-radius: 8px;
}

input[type="submit"]:hover {
    background: #0077aa;
}

footer {
    background: #0077aa;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
}

.social-icons a {
    color: white;
    margin: 0 10px;
    font-size: 1.4rem;
}

.social-icons a:hover {
    color: #ccefff;
}

<h1>Contact Us</h1>

<div class="container">

  <h2>We’d love to chill at your next event.</h2>

  <p style="font-size:1.2rem; text-align:center;"><strong>Email:</strong> arcticbites@gmail.com</p>
  <p style="font-size:1.2rem; text-align:center;"><strong>Phone:</strong> (555) 123‑4567</p>
  <h3>Reach Out to the Owner</h3>

  <form>
    <label>Your Name:</label>
    <input type="text" placeholder="Enter your name">

    <label>Your Phone Number:</label>
    <input type="text" placeholder="Enter your phone number">

    <label>Your Email:</label>
    <input type="email" placeholder="Enter your email">

    <label>Reason for Contact:</label>
    <select>
      <option>Complaint</option>
      <option>Request for Service</option>
      <option>Positive Review</option>
    </select>

    <label>Your Message:</label>
    <textarea placeholder="Write your message here"></textarea>

    <input type="submit" value="Send Message">
  </form>

  <h3>Request Our Snow Cone Truck</h3>

  <form>
    <label>Your Name:</label>
    <input type="text" placeholder="Enter your name">

    <label>Your Email:</label>
    <input type="email" placeholder="Enter your email">

    <label>Your Phone Number:</label>
    <input type="text" placeholder="Enter your phone number">

    <label>Requested Date:</label>
    <input type="date">

    <label>Event Description:</label>
    <textarea placeholder="Describe your event"></textarea>

    <input type="submit" value="Submit Request">
  </form>
